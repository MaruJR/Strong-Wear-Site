<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strong Wear</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header>
        <img src="img/strong-wear-logo2.png" id="logo" width="100px" height="40px">
        <textarea id="barraBusqueda" Placeholder="Introduzca su busqueda..."></textarea>
        <button id="abrir" class="abrirMenu"><i class="bi bi-list"></i></button>
        <nav class="navbar-header" id="nav">
            <button id="cerrar" class="cerrarMenu"><i class="bi bi-x"></i></button>
            <ul class="navList">
                <li><a href="index.html">Página principal</a></li>              
                <li><a href="nosotros.html">Sobre Nosotros</a></li>              
            </ul>
        </nav>
    </header>

    <div class="contenedor-formulario">
        <div class="card">
            <form method="GET" action="">
                <label class="textoform" for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" required>
                <label class="textoform" for="apellidos">Apellidos</label>
                <input type="text" id="apellidos" name="apellidos" required>
                <label class="textoform">Sexo</label>

                <div class="radio-row">
                    <label><input type="radio" name="sexo" value="hombre" required> Hombre</label>
                    <label><input type="radio" name="sexo" value="mujer"> Mujer</label>
                </div>

                <label class="textoform" for="email">Correo electrónico</label>
                <input type="text" id="email" name="email" required>
                <label class="textoform" for="pais">País</label>

                <select id="pais" name="pais">
                    <option value="argentina" selected>Argentina</option>
                    <option value="bolivia">Bolivia</option>
                    <option value="brasil">Brasil</option>
                    <option value="chile">Chile</option>
                    <option value="colombia">Colombia</option>
                    <option value="ecuador">Ecuador</option>
                    <option value="guyana">Guyana</option>
                    <option value="paraguay">Paraguay</option>
                    <option value="peru">Perú</option>
                    <option value="surinam">Surinam</option>
                    <option value="uruguay">Uruguay</option>
                    <option value="venezuela">Venezuela</option>
                </select>

                <div class="check-field">
                    <input type="checkbox" id="condiciones" name="condiciones" required>
                    <label for="condiciones">Declaro haber leído y aceptar las <a href="#">condiciones generales</a> del programa y la normativa sobre protección de datos.</label>
                </div>

                <button class="botonForm" type="submit">Enviar</button>
            </form>
        </div>
    </div>

    <footer>
        <ul class="navListFooter">
            <li><a href="">Placeholder 1</a></li>              
            <li><a href="">Placeholder 2</a></li>              
            <li><a href="">Placeholder 3</a></li>              
        </ul>
    </footer>

    <script src="./js/main.js"></script>
</body>
</html>
